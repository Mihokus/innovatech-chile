name: "CI/CD Deploy Innovatech Chile"

on:
  push:
    branches:
      - deploy

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 035167451253.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-and-push:
    name: "Build y Push a ECR"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login a ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push Frontend
        run: |
          docker build \
            -t ${{ env.ECR_REGISTRY }}/innovatech/frontend:${{ github.sha }} \
            -t ${{ env.ECR_REGISTRY }}/innovatech/frontend:latest \
            ./front_despacho
          docker push ${{ env.ECR_REGISTRY }}/innovatech/frontend:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/innovatech/frontend:latest

      - name: Build y Push Backend Despachos
        run: |
          docker build \
            -t ${{ env.ECR_REGISTRY }}/innovatech/backend-despachos:${{ github.sha }} \
            -t ${{ env.ECR_REGISTRY }}/innovatech/backend-despachos:latest \
            -f back-despachos/Dockerfile \
            ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker push ${{ env.ECR_REGISTRY }}/innovatech/backend-despachos:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/innovatech/backend-despachos:latest

      - name: Build y Push Backend Ventas
        run: |
          docker build \
            -t ${{ env.ECR_REGISTRY }}/innovatech/backend-ventas:${{ github.sha }} \
            -t ${{ env.ECR_REGISTRY }}/innovatech/backend-ventas:latest \
            -f back-ventas/Dockerfile \
            ./back-Ventas_SpringBoot/Springboot-API-REST
          docker push ${{ env.ECR_REGISTRY }}/innovatech/backend-ventas:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/innovatech/backend-ventas:latest

  deploy:
    name: "Deploy en EC2"
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy todos los servicios via Frontend Bastion
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_FRONTEND_HOST }}
          username: ec2-user
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin \
              035167451253.dkr.ecr.us-east-1.amazonaws.com

            docker pull 035167451253.dkr.ecr.us-east-1.amazonaws.com/innovatech/frontend:latest
            docker stop frontend 2>/dev/null || true
            docker rm   frontend 2>/dev/null || true
            docker run -d \
              --name frontend \
              --restart unless-stopped \
              -p 80:80 \
              -e BACKEND_DESPACHOS_HOST=10.0.133.70 \
              -e BACKEND_VENTAS_HOST=10.0.149.255 \
              035167451253.dkr.ecr.us-east-1.amazonaws.com/innovatech/frontend:latest

            ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy.pem ec2-user@10.0.133.70 "
              aws ecr get-login-password --region us-east-1 | \
                docker login --username AWS --password-stdin \
                035167451253.dkr.ecr.us-east-1.amazonaws.com
              docker pull 035167451253.dkr.ecr.us-east-1.amazonaws.com/innovatech/backend-despachos:latest
              docker stop backend-despachos 2>/dev/null || true
              docker rm   backend-despachos 2>/dev/null || true
              docker run -d \
                --name backend-despachos \
                --restart unless-stopped \
                -p 8081:8081 \
                -e DB_ENDPOINT=10.0.131.12 \
                -e DB_PORT=3306 \
                -e DB_NAME=despachos_db \
                -e DB_USERNAME=innovatech_user \
                -e DB_PASSWORD=InnovatechPass456! \
                035167451253.dkr.ecr.us-east-1.amazonaws.com/innovatech/backend-despachos:latest
              docker image prune -f
            "

            ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy.pem ec2-user@10.0.149.255 "
              aws ecr get-login-password --region us-east-1 | \
                docker login --username AWS --password-stdin \
                035167451253.dkr.ecr.us-east-1.amazonaws.com
              docker pull 035167451253.dkr.ecr.us-east-1.amazonaws.com/innovatech/backend-ventas:latest
              docker stop backend-ventas 2>/dev/null || true
              docker rm   backend-ventas 2>/dev/null || true
              docker run -d \
                --name backend-ventas \
                --restart unless-stopped \
                -p 8080:8080 \
                -e DB_ENDPOINT=10.0.131.12 \
                -e DB_PORT=3306 \
                -e DB_NAME=ventas_db \
                -e DB_USERNAME=innovatech_user \
                -e DB_PASSWORD=InnovatechPass456! \
                035167451253.dkr.ecr.us-east-1.amazonaws.com/innovatech/backend-ventas:latest
              docker image prune -f
            "

            docker image prune -f